[pytest]
testpaths = tests
# --strict-markers turns a mistyped marker into an error rather than a silently
# inert decorator; the suite already relies on xfail(strict=True) being honoured.
addopts = -v --tb=short --strict-markers
# tests/manual/ holds long-running exploratory checks; they are excluded by the
# manual_test_ filename prefix not matching python_files below.
python_files = test_*.py
markers =
    slow: long-running tests (deselect with '-m "not slow"')
